<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worklow Image Canvas</title><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,-apple-system,sans-serif;background:#edf0e9;color:#2d392c}.app{height:100dvh;display:flex;flex-direction:column}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid #d8ddce;background:#f9faf6}.toolbar strong{font-size:16px;margin-right:14px}.toolbar label{display:flex;align-items:center;gap:5px;font-size:11px}.toolbar input[type=number]{width:82px;padding:6px;border:1px solid #cbd4c4;border-radius:5px}.toolbar input[type=range]{width:80px;accent-color:#819c54}button{background:#fff;border:1px solid #d1d9c7;border-radius:6px;color:#33442b;padding:8px 11px;cursor:pointer}button:hover{background:#ecf2e1}button:disabled{opacity:.45;cursor:default}.primary{background:#cfed9d}.spacer{flex:1}.viewport{flex:1;min-height:150px;position:relative;overflow:hidden;touch-action:none;background:#e9ede7;background-image:radial-gradient(#cad3c7 1px,transparent 1px);background-size:20px 20px}.world{position:absolute;top:0;left:0;transform-origin:0 0}.canvas{position:relative;background:#fff;box-shadow:0 12px 38px #17241532;border:1px solid #d9dfd4}.image{position:absolute;cursor:grab;touch-action:none;outline:2px solid transparent}.image.active{outline-color:#759946;z-index:999999!important}.image img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}.handle{position:absolute;bottom:-6px;right:-6px;width:13px;height:13px;background:#fff;border:2px solid #70934a;cursor:nwse-resize;display:none}.active .handle{display:block}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#7d8778;width:75%;pointer-events:none}.empty b{font-size:21px;color:#53634d;display:block;margin-bottom:8px}.footer{padding:8px 14px;display:flex;justify-content:space-between;background:#fafbf8;color:#72806a;border-top:1px solid #d6decd;font-size:11px}#pick,#import{display:none}@media(max-width:800px){.toolbar{gap:6px;padding:8px}.toolbar strong{width:100%}.toolbar input[type=range]{width:60px}}
</style></head><body><div class="app"><div class="toolbar"><strong>Image Canvas</strong><button class="primary" id="add">＋ Add images</button><label>Width <input id="ws" type="range" min="200" max="8000" step="10"><input id="wn" type="number" min="200" max="8000" step="1" aria-label="Canvas width in pixels"> px</label><label>Height <input id="hs" type="range" min="200" max="8000" step="10"><input id="hn" type="number" min="200" max="8000" step="1" aria-label="Canvas height in pixels"> px</label><button id="delete" disabled>Delete image</button><button id="duplicate" disabled>Duplicate</button><span class="spacer"></span><button id="minus">−</button><button id="zoom">Fit</button><button id="plus">＋</button><button id="export">↓ PNG</button><button id="backup">↓ Backup</button><button id="restore">↑ Restore</button><input type="file" id="pick" accept="image/*" multiple><input type="file" id="import" accept=".json,application/json"></div><div class="viewport" id="vp" tabindex="0"><div class="world" id="world"><div class="canvas" id="canvas"><div id="items"></div><div id="empty" class="empty"><b>Place your images here</b>Drag & drop pictures, or paste using Ctrl + V.<p>Drag to arrange · pull the corner to resize · middle-mouse drag to pan · scroll to zoom</p></div></div></div></div><div class="footer"><span id="status">Loading saved workspace…</span><span id="count">0 images</span></div></div><script>
(()=>{
const $=id=>document.getElementById(id),vp=$('vp'),world=$('world'),canvas=$('canvas'),items=$('items');let W=1600,H=1000,images=[],sel=null,seq=0,scale=0.6,px=0,py=0,drag=null,saveTimer=0,db;
function fit(){scale=Math.min(1,(vp.clientWidth-55)/W,(vp.clientHeight-55)/H);scale=Math.max(.03,scale);px=(vp.clientWidth-W*scale)/2;py=(vp.clientHeight-H*scale)/2;transform()}
function transform(){world.style.transform='translate('+px+'px,'+py+'px) scale('+scale+')';$('zoom').textContent=Math.round(scale*100)+'%';canvas.style.width=W+'px';canvas.style.height=H+'px'}
function coords(x,y){const b=vp.getBoundingClientRect();return{x:(x-b.left-px)/scale,y:(y-b.top-py)/scale}}
function syncSize(){for(const [a,v] of [['wn',W],['ws',W],['hn',H],['hs',H]])$(a).value=v;transform()}
for(const [n,r,key] of [['wn','ws','W'],['hn','hs','H']]){function change(e){let v=Math.max(200,Math.min(8000,Number(e.target.value)||200));if(key==='W')W=v;else H=v;syncSize();queue()}$(n).addEventListener('change',change);$(r).addEventListener('input',change)}
function select(id){sel=id;items.querySelectorAll('.image').forEach(n=>n.classList.toggle('active',Number(n.dataset.id)===sel));$('delete').disabled=$('duplicate').disabled=sel===null}
function render(){items.textContent='';for(const p of images){let div=document.createElement('div');div.className='image';div.dataset.id=p.id;div.style.cssText='left:'+p.x+'px;top:'+p.y+'px;width:'+p.w+'px;height:'+p.h+'px;z-index:'+p.id;let im=document.createElement('img');im.src=p.src;im.draggable=false;div.appendChild(im);let handle=document.createElement('div');handle.className='handle';div.appendChild(handle);items.appendChild(div)}$('empty').hidden=images.length>0;$('count').textContent=images.length+' images';select(sel)}
function addFile(file){if(!file.type.startsWith('image/'))return;const rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let ratio=Math.min(1,520/Math.max(im.naturalWidth,im.naturalHeight));let w=Math.max(20,Math.round(im.naturalWidth*ratio)),h=Math.max(20,Math.round(im.naturalHeight*ratio));let pos=coords(vp.getBoundingClientRect().left+vp.clientWidth/2,vp.getBoundingClientRect().top+vp.clientHeight/2);let p={id:++seq,src:rd.result,x:pos.x-w/2,y:pos.y-h/2,w,h};images.push(p);render();select(p.id);queue()};im.src=rd.result};rd.readAsDataURL(file)}
$('add').onclick=()=>$('pick').click();$('pick').onchange=e=>{[...e.target.files].forEach(addFile);e.target.value=''};
vp.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==1)return;const node=e.target.closest('.image');if(e.button===1){e.preventDefault();drag={kind:'pan',x:e.clientX,y:e.clientY,px,py};vp.setPointerCapture(e.pointerId);return}if(node){const p=images.find(p=>p.id===+node.dataset.id);select(p.id);drag={kind:e.target.classList.contains('handle')?'resize':'move',id:p.id,x:e.clientX,y:e.clientY,ox:p.x,oy:p.y,w:p.w,h:p.h};vp.setPointerCapture(e.pointerId)}else select(null)});
vp.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});vp.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.kind==='pan'){px=drag.px+dx;py=drag.py+dy;transform();return}let p=images.find(x=>x.id===drag.id);if(!p)return;if(drag.kind==='move'){p.x=drag.ox+dx/scale;p.y=drag.oy+dy/scale}else{p.w=Math.max(30,drag.w+dx/scale);p.h=p.w*drag.h/drag.w}const node=items.querySelector('[data-id="'+p.id+'"]');node.style.left=p.x+'px';node.style.top=p.y+'px';node.style.width=p.w+'px';node.style.height=p.h+'px'});
function end(){if(drag?.kind!=='pan'&&drag)queue();drag=null}vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,old=scale;scale=Math.max(.03,Math.min(5,scale*Math.exp(-e.deltaY*.0012)));px=x-(x-px)*scale/old;py=y-(y-py)*scale/old;transform()},{passive:false});
$('zoom').onclick=fit;function zoom(k){const x=vp.clientWidth/2,y=vp.clientHeight/2,old=scale;scale=Math.max(.03,Math.min(5,scale*k));px=x-(x-px)*scale/old;py=y-(y-py)*scale/old;transform()}$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);
function remove(){if(sel===null)return;images=images.filter(p=>p.id!==sel);sel=null;render();queue()}$('delete').onclick=remove;$('duplicate').onclick=()=>{let p=images.find(p=>p.id===sel);if(!p)return;let copy={...p,id:++seq,x:p.x+28,y:p.y+28};images.push(copy);render();select(copy.id);queue()};
vp.addEventListener('dragover',e=>e.preventDefault());vp.addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].forEach(addFile)});
document.addEventListener('paste',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(!document.hasFocus())return;const files=[...(e.clipboardData?.items||[])].filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile());if(files.length){e.preventDefault();files.forEach(addFile)}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='Delete'||e.key==='Backspace')remove();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();$('duplicate').click()}});
function getDB(){return new Promise((ok,fail)=>{const r=indexedDB.open('worklow-image-canvas',1);r.onupgradeneeded=()=>r.result.createObjectStore('boards');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
function write(){if(!db)return;const t=db.transaction('boards','readwrite');t.objectStore('boards').put({W,H,images},'default');t.oncomplete=()=>$('status').textContent='Saved automatically in this browser';t.onerror=()=>{$('status').textContent='Autosave failed — export a backup'}}
function queue(){$('status').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(write,450)}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('backup').onclick=()=>download(new Blob([JSON.stringify({version:1,W,H,images})],{type:'application/json'}),'worklow-image-canvas.json');
$('restore').onclick=()=>$('import').click();$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.images)||!Number.isFinite(d.W)||!Number.isFinite(d.H)||d.W<200||d.W>8000||d.H<200||d.H>8000||!d.images.every(p=>typeof p.src==='string'&&/^data:image\//.test(p.src)))throw Error();W=d.W;H=d.H;images=d.images.map(p=>({...p,id:++seq}));sel=null;syncSize();fit();render();queue()}catch{alert('Invalid canvas backup file')}e.target.value=''};
$('export').onclick=async()=>{const out=document.createElement('canvas');out.width=W;out.height=H;const ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);for(const p of images){let im=new Image();try{await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=p.src});ctx.drawImage(im,p.x,p.y,p.w,p.h)}catch{}}out.toBlob(b=>b&&download(b,'worklow-canvas.png'))};
getDB().then(d=>{db=d;const r=db.transaction('boards').objectStore('boards').get('default');r.onsuccess=()=>{const v=r.result;if(v&&Array.isArray(v.images)){W=v.W||W;H=v.H||H;images=v.images;seq=Math.max(0,...images.map(i=>i.id||0))}syncSize();fit();render();$('status').textContent='Saved automatically in this browser'};r.onerror=()=>{$('status').textContent='Storage unavailable'}}).catch(()=>{$('status').textContent='Storage unavailable — use Backup'});window.addEventListener('resize',()=>{if(!drag)fit()});syncSize();fit();render();
})();
</script></body></html>
