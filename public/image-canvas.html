<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worklow Image Canvas</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;background:#edf0e8;color:#263323}button,input{font:inherit}button{cursor:pointer;border:1px solid #d1d8c7;border-radius:6px;background:#fff;color:#293629;padding:8px 11px}button:hover{background:#eff4e8}button:disabled{opacity:.4}.top{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:12px 15px;background:#f8faf5;border-bottom:1px solid #dce3d5}.top strong{font-size:16px;margin-right:10px}.grow{flex:1}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:10px 15px;background:#fafbf8;border-bottom:1px solid #dce3d5}.controls label{display:flex;align-items:center;gap:5px}.controls input[type=range]{width:105px;accent-color:#718b4c}.controls input[type=number]{width:74px;padding:6px;border:1px solid #d0d7c9;border-radius:5px}.stage{height:calc(100vh - 149px);min-height:360px;position:relative;overflow:hidden;background:#dce1d9;touch-action:none;cursor:default}.world{position:absolute;top:0;left:0;transform-origin:top left}.canvas{position:relative;background:white;box-shadow:0 5px 34px #1b281d26;outline:1px solid #c5c9bf}.image{position:absolute;touch-action:none;cursor:grab;user-select:none}.image.selected{outline:2px solid #688bdc}.image img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}.resize{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:white;border:2px solid #4b77db;cursor:nwse-resize;display:none}.selected .resize{display:block}.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:#929f8c;font-size:17px;line-height:1.8;white-space:nowrap}.foot{display:flex;justify-content:space-between;gap:8px;padding:8px 15px;color:#728069;background:#f8faf5}.error{color:#b43e38}#picker,#restore{display:none}@media(max-width:750px){.stage{height:calc(100vh - 220px)}.controls input[type=range]{width:70px}.hint{font-size:12px}}
</style></head><body>
<div class="top"><strong>▧ Image Canvas</strong><button id="add">＋ Add images</button><button id="dup">Duplicate</button><button id="del">Delete selected</button><button id="export">↓ Export PNG</button><button id="backup">↓ Save project</button><button id="import">↑ Import</button><span class="grow"></span><span id="status">Loading saved canvas…</span></div>
<div class="controls">
<label>Width <input id="wr" type="range" min="200" max="8000" step="10" value="1600"><input id="wn" type="number" min="200" max="8000" value="1600">px</label>
<label>Height <input id="hr" type="range" min="200" max="8000" step="10" value="1000"><input id="hn" type="number" min="200" max="8000" value="1000">px</label>
<span class="grow"></span><button id="minus">−</button><button id="zoom">100%</button><button id="plus">＋</button><button id="fit">Fit</button></div>
<div id="stage" class="stage" tabindex="0"><div id="world" class="world"><div id="canvas" class="canvas"><div id="items"></div><div id="hint" class="hint">Drop images here or paste using Ctrl + V</div></div></div></div>
<div class="foot"><span>Middle mouse drag: pan · Mouse wheel: zoom · Click: select · Drag corner: resize</span><span id="count">0 images</span></div>
<input id="picker" type="file" accept="image/*" multiple><input id="restore" type="file" accept=".json,application/json">
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),world=$('world'),canvas=$('canvas'),items=$('items');
let width=1600,height=1000,zoom=1,tx=0,ty=0,list=[],selected=null,id=0,drag=null,db=null,queue=Promise.resolve(),saveTimer;
const key='image-canvas-v1';const valid=n=>Math.max(200,Math.min(8000,Math.round(Number(n)||200)));
function dimensions(w,h){width=valid(w);height=valid(h);canvas.style.width=width+'px';canvas.style.height=height+'px';$('wn').value=width;$('wr').value=width;$('hn').value=height;$('hr').value=height}
function transform(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')';$('zoom').textContent=Math.round(zoom*100)+'%'}
function fit(){zoom=Math.min(1,(stage.clientWidth-70)/width,(stage.clientHeight-70)/height);zoom=Math.max(.04,zoom);tx=(stage.clientWidth-width*zoom)/2;ty=(stage.clientHeight-height*zoom)/2;transform()}
function setZoom(z,cx=stage.clientWidth/2,cy=stage.clientHeight/2){let old=zoom;zoom=Math.max(.05,Math.min(4,z));tx=cx-(cx-tx)*zoom/old;ty=cy-(cy-ty)*zoom/old;transform()}
function render(){items.replaceChildren();for(const p of list){const el=document.createElement('div');el.className='image'+(selected===p.id?' selected':'');el.dataset.id=p.id;el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.w+'px';el.style.height=p.h+'px';el.style.zIndex=p.z;let img=document.createElement('img');img.src=p.src;img.draggable=false;el.append(img);let handle=document.createElement('span');handle.className='resize';el.append(handle);items.append(el)}$('hint').hidden=list.length>0;$('count').textContent=list.length+' images';$('del').disabled=$('dup').disabled=selected===null}
function mark(){clearTimeout(saveTimer);$('status').textContent='Saving…';saveTimer=setTimeout(save,350)}
function snapshot(){return {version:1,width,height,list}}
function save(){if(!db)return;$('status').textContent='Saving…';const data=structuredClone(snapshot());queue=queue.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{let t=db.transaction('boards','readwrite');t.objectStore('boards').put(data,key);t.oncomplete=()=>{ $('status').textContent='Saved in this browser';resolve()};t.onerror=t.onabort=()=>{ $('status').textContent='Storage full — export project backup';reject(t.error)}}));queue.catch(()=>{})}
async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('worklow-image-canvas',1);r.onupgradeneeded=()=>r.result.createObjectStore('boards');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){try{db=await openDB();const result=await new Promise((resolve,reject)=>{let r=db.transaction('boards').objectStore('boards').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(result){dimensions(result.width,result.height);list=Array.isArray(result.list)?result.list:[];id=list.reduce((n,p)=>Math.max(n,Number(p.id)||0,Number(p.z)||0),0)}$('status').textContent='Saved in this browser'}catch(e){$('status').textContent='Storage unavailable — export projects manually';$('status').className='error'}render();requestAnimationFrame(fit)}
function screenToCanvas(clientX,clientY){const b=stage.getBoundingClientRect();return {x:(clientX-b.left-tx)/zoom,y:(clientY-b.top-ty)/zoom}}
function addImage(src,w,h){const size=Math.min(1,500/Math.max(w,h));const cw=Math.max(20,Math.round(w*size)),ch=Math.max(20,Math.round(h*size));const b=stage.getBoundingClientRect(),c=screenToCanvas(b.left+b.width/2,b.top+b.height/2);const p={id:++id,src,x:Math.max(0,c.x-cw/2+list.length*12),y:Math.max(0,c.y-ch/2+list.length*12),w:cw,h:ch,z:id};list.push(p);selected=p.id;render();mark()}
function ingest(files){for(const f of files){if(!f||!f.type.startsWith('image/'))continue;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>addImage(reader.result,im.naturalWidth,im.naturalHeight);im.src=reader.result};reader.readAsDataURL(f)}}
stage.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==1)return;stage.focus({preventScroll:true});if(e.button===1){e.preventDefault();drag={mode:'pan',x:e.clientX,y:e.clientY,tx,ty};stage.setPointerCapture(e.pointerId);return}const el=e.target.closest('.image');if(!el){selected=null;render();return}const p=list.find(p=>p.id==Number(el.dataset.id));if(!p)return;selected=p.id;drag={mode:e.target.classList.contains('resize')?'resize':'move',x:e.clientX,y:e.clientY,ox:p.x,oy:p.y,ow:p.w,oh:p.h,id:p.id};stage.setPointerCapture(e.pointerId);render();e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.mode==='pan'){tx=drag.tx+dx;ty=drag.ty+dy;transform();return}const p=list.find(p=>p.id===drag.id);if(!p)return;if(drag.mode==='move'){p.x=drag.ox+dx/zoom;p.y=drag.oy+dy/zoom}else{const scale=Math.max(.05,(drag.ow+dx/zoom)/drag.ow);p.w=Math.round(drag.ow*scale);p.h=Math.round(drag.oh*scale)}const el=items.querySelector('[data-id="'+p.id+'"]');if(el){el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.w+'px';el.style.height=p.h+'px'}});
stage.addEventListener('pointerup',()=>{if(drag&&drag.mode!=='pan')mark();drag=null});stage.addEventListener('pointercancel',()=>drag=null);
stage.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
stage.addEventListener('wheel',e=>{e.preventDefault();const b=stage.getBoundingClientRect();setZoom(zoom*Math.exp(-e.deltaY*.0013),e.clientX-b.left,e.clientY-b.top)},{passive:false});
stage.addEventListener('dragover',e=>e.preventDefault());stage.addEventListener('drop',e=>{e.preventDefault();ingest(e.dataTransfer.files)});
function focused(){return document.activeElement===stage||stage.matches(':hover')}
document.addEventListener('paste',e=>{if(!focused())return;const files=[...(e.clipboardData?.items||[])].filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile());if(files.length){e.preventDefault();ingest(files)}});
document.addEventListener('keydown',e=>{if(!focused()||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate()}});
function remove(){if(selected===null)return;list=list.filter(p=>p.id!==selected);selected=null;render();mark()}function duplicate(){const p=list.find(p=>p.id===selected);if(!p)return;const n={...p,id:++id,z:id,x:p.x+25,y:p.y+25};list.push(n);selected=n.id;render();mark()}
$('del').onclick=remove;$('dup').onclick=duplicate;$('add').onclick=()=>$('picker').click();$('picker').onchange=e=>{ingest(e.target.files);e.target.value=''};
for(const [range,number] of [['wr','wn'],['hr','hn']]){const r=$(range),n=$(number);r.oninput=()=>{n.value=r.value;dimensions($('wn').value,$('hn').value);mark()};n.onchange=()=>{dimensions($('wn').value,$('hn').value);mark()}}
$('minus').onclick=()=>setZoom(zoom/1.25);$('plus').onclick=()=>setZoom(zoom*1.25);$('zoom').onclick=()=>setZoom(1);$('fit').onclick=fit;
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('backup').onclick=()=>download(new Blob([JSON.stringify(snapshot())],{type:'application/json'}),'worklow-image-canvas.json');
$('import').onclick=()=>$('restore').click();$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.list)||data.list.some(p=>!/^data:image\/(png|jpeg|webp|gif);base64,/.test(p.src)||!Number.isFinite(p.x)||!Number.isFinite(p.w)))throw Error('Invalid project');dimensions(data.width,data.height);list=data.list;id=list.reduce((m,p)=>Math.max(m,p.id||0,p.z||0),0);selected=null;render();fit();mark()}catch(err){alert('Invalid image canvas project file')}e.target.value=''};
$('export').onclick=async()=>{if(width*height>35000000){alert('This canvas is too large to export in this browser. Reduce its dimensions.');return}const c=document.createElement('canvas');c.width=width;c.height=height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);for(const p of [...list].sort((a,b)=>a.z-b.z)){const im=new Image();try{await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=p.src});ctx.drawImage(im,p.x,p.y,p.w,p.h)}catch{}}c.toBlob(blob=>{if(blob)download(blob,'worklow-image-canvas.png')},'image/png')};
load();
})();
</script></body></html>
